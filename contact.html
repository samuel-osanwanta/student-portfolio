<main>
<section class="section">
<div class="wrap narrow">
<h1>Contact me</h1>
<p>Fill in every field and I’ll know how to reach you.</p>
<form id="contact-form" novalidate>
<div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name"><span class="error" id="name-error"></span></div>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email"><span class="error" id="email-error"></span></div>
<div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric"><span class="error" id="phone-error"></span></div>
<div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><span class="error" id="message-error"></span></div>
<button class="btn" type="submit">Send message</button>
</form>
<p class="success" id="form-success" role="status"></p>
<p class="note">This is a demo form. It checks your entries in the browser and doesn’t send email.</p>
</div>
</section>
</main>
<footer class="site">
<div class="wrap"><p>&copy; <span id="year">2026</span> Osanwanta Eniola Samuel. Built for COS 106, MIVA Open University.</p></div>
